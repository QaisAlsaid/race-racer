<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function() {
      const targetBase = "http://fi3.bot-hosting.net:20803";

      const path = window.location.pathname.replace(/^\/race-racer/, ""); 
      const search = window.location.search;
      const hash = window.location.hash;

      const target = targetBase + path + search + hash;

      window.location.replace(target);
    })();
  </script>
</head>
<body>
  Redirecting… <br/>
  <a id="link" href="#">Click here if you are not redirected</a>
  <script>
    document.getElementById("link").href = window.location.href;
  </script>
</body>
</html>
